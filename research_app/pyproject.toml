[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "blackjack-research-app"
version = "0.1.0"
description = "Blackjack research app using blackjack.lib"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
blackjack-research = "blackjack_research.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["blackjack_research*"]
